name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format check, tests and build
        run: ./gradlew --no-daemon spotlessCheck test build

      - name: Audit script tests
        run: sh scripts/tests/test-audit-imap-local-password.sh

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-imap-auth-provider
          path: build/libs/*.jar
          if-no-files-found: error
